# main 只读构建与 GitHub Pages 部署（Ticket 08，发布闸门入口）。
#
# 职责边界（MVP-Q8/Q21，架构「main 推送：读取已保存状态 → 生成快照 → 检查/构建 →
# 发布，不抓源、不写首次收录」）：
# - 触发：main 推送（代码变更发布）、repository_dispatch:data-updated（update-data 每次
#   data 实际前进后触发；data 分支推送本身不会触发——GitHub 对 push 事件使用被推送分支
#   上的工作流文件版本，data 分支只含三文件不含工作流定义）、手动 dispatch。
#   repository_dispatch 运行的 GITHUB_SHA = 默认分支 main 最新提交（docs.github.com
#   事件表已查证），deploy 对 github-pages 环境以 main ref 放行。
# - 只读 data：对 data 分支单一提交 checkout（不读变化中文件拼混合快照，MVP-Q21 第 2 项），
#   经 scripts/build-snapshot.ts 做 verifyManifest 摘要校验（损坏即失败，MVP-Q13）后
#   生成 7 天窗口公开快照，再以 SNAPSHOT_PATH 注入 astro build。
# - 不抓源：本工作流没有任何抓取步骤（source-fetch/rss-parser 不进入构建 import 图），
#   不写 data 分支任何文件，不产生新的首次收录时间。抓源与写入唯一入口是 update-data。
# - 失败方向安全：data 分支缺失、三文件损坏、构建失败均使本工作流失败，不部署任何
#   替代内容（绝不部署演示数据冒充真实站点），线上保持上一次成功站点（MVP-Q13）。
#
# Pages 部署要求（仓库设置，2026-10-04 已配置）：
# - Settings→Pages 来源为 GitHub Actions（API build_type=workflow）；
# - github-pages 环境部署分支策略含 main（本工作流所有触发形态的运行 ref 均为 main）。
name: build-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - data-updated

# 最小权限：contents: read 供 checkout；pages: write + id-token: write 供官方
# deploy-pages（OIDC 换取部署凭证）。不授予 contents: write（本工作流不写任何分支）。
permissions:
  contents: read
  pages: write
  id-token: write

# 串行控制：同一时刻只允许一个构建/部署运行；排队等待而非取消
# （部署中途取消可能留下不一致状态；MVP-Q17 发布串行）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 代码版本：push（仅 main 触发）取触发提交本身；repository_dispatch 的 GITHUB_SHA
      # 事件表已查证为默认分支 main 最新提交，workflow_dispatch 默认亦为 main——
      # 三种触发形态 GITHUB_SHA 即所需 ref（T08 收尾项：删除不可达的 GITHUB_REF_NAME="data" 死分支）。
      - name: Resolve code ref（GITHUB_SHA 即所需 ref）
        id: code
        run: echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout code（main，只读）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.code.outputs.ref }}

      # 只读边界：data 分支检出为独立子目录；本工作流没有任何对 data 的写入步骤。
      - name: Checkout data branch（只读：单一提交，避免混合快照）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: data-branch

      - name: Read data branch HEAD（数据版本可追溯）
        id: data
        working-directory: data-branch
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node（与本地/锁文件一致的运行时，MVP-Q10）
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.2

      - name: Install dependencies（严格按锁文件）
        run: pnpm install --frozen-lockfile

      # ---- 发布前门禁（2026-10-20）----
      # 位置约束：必须在 upload-pages-artifact 之前。deploy 有 needs: build，
      # 因此下列任一步骤失败 → build 失败 → deploy 连调度都不会发生。
      # 本工作流由 push(main) / workflow_dispatch / repository_dispatch 三种形态触发，
      # 门禁在同一条 build job 内，故三种形态同时受约束；不另建并联工作流——
      # 并联的两个运行彼此无先后保证，e2e 失败时代码可能已经上线。
      # 注意：下方测试构建使用**固定夹具**（不设 SNAPSHOT_PATH → 走默认演示快照），
      # 与紧随其后的生产构建（SNAPSHOT_PATH=.snapshot/snapshot.json）是两次独立构建，
      # 互不污染：产物断言测夹具，部署产物测真实数据。
      - name: Check types（astro check）
        run: pnpm run check

      - name: Build with fixtures for tests（不注入生产快照，故走默认演示快照）
        run: pnpm run build

      - name: Unit + artifact tests（产物断言针对上面这次夹具构建）
        run: pnpm run test:node

      - name: Install Playwright browsers（仅 chromium，与 test:e2e 口径一致）
        if: github.event_name != 'repository_dispatch'
        run: pnpm exec playwright install --with-deps chromium

      # 分层（2026-10-20 用户裁定）：repository_dispatch 由 data 更新触发，**代码零改动**，
      # 同一 commit 重复跑 e2e 不产生新信息（实测近 30 天 17/47 次运行属此类，约占 76 分钟/月）。
      # 代码推送（push / workflow_dispatch）仍跑全量 e2e——那才是 e2e 该保护的对象。
      # 保留 check / build / test:node：它们只需秒级，且真实数据变化可能暴露契约问题。
      # 已知取舍：data 更新导致「代码未改但真实数据渲染崩坏」这类问题 e2e 抓不到（e2e 跑夹具）；
      # 该风险由随后的生产 Build site 承担——它会真实构建 .snapshot/snapshot.json，失败即阻断发布。
      - name: E2E tests（chromium project；webServer 复用上面已构建的 dist）
        if: github.event_name != 'repository_dispatch'
        run: pnpm run test:e2e
      # ---- 门禁结束；以下为生产构建与发布 ----

      # data 三文件 → 摘要校验（损坏即失败）→ 7 天窗口公开快照（只读转换，不触网）。
      - name: Generate public snapshot from data branch
        run: >
          node scripts/build-snapshot.ts
          --data-dir data-branch
          --out .snapshot/snapshot.json

      # 真实数据构建（isFixture=false，页面不再标注「演示数据」）；不抓源、不写 data。
      - name: Build site
        run: pnpm run build
        env:
          SNAPSHOT_PATH: .snapshot/snapshot.json

      - name: Record versions（构建记录固定代码与数据版本，MVP-Q21）
        run: |
          {
            echo "code ref: ${{ steps.code.outputs.ref }}"
            echo "code sha: $(git rev-parse HEAD)"
            echo "data sha: ${{ steps.data.outputs.sha }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    # 显式 main 保护（T08 收尾项）：本工作流所有触发形态的运行 ref 均应为 main；
    # 此条件把该约束固化为部署闸门，误配置其他 ref 时部署步骤直接跳过而非误发。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
