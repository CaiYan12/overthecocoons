# data 分支首次初始化（MVP-Q13：仅独立手动入口）。
#
# 首次初始化是明确的人为动作：本工作流只允许 workflow_dispatch 手动触发，
# 无定时触发。日常定时/手动更新发现无权威状态会报错停止，绝不自动初始化；
# 数据损坏的恢复由人工从 data 分支 Git 历史核对后执行（MVP-Q18），不走本工作流。
#
# data 分支已存在时前置检查即失败（恢复由人工从 Git 历史核对，绝不自动清空台账重采）。
name: init-data

on:
  workflow_dispatch:

# 最小权限：仅需推送新建的 data 分支；不触碰 main，不使用强制推送。
permissions:
  contents: write

concurrency:
  group: init-data
  cancel-in-progress: false

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main（只读：编排脚本与依赖）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.26.2

      - name: Install dependencies（严格按锁文件）
        run: pnpm install --frozen-lockfile

      # 防重复初始化：data 分支已存在即失败（恢复按 MVP-Q13/Q18 人工处理）。
      - name: Verify data branch does not exist
        run: |
          if git ls-remote --exit-code --heads origin data; then
            echo "::error::data 分支已存在。初始化仅允许一次；恢复请人工从 data 分支 Git 历史核对（MVP-Q13/Q18）。"
            exit 1
          fi

      # 孤儿 worktree（git >= 2.42）：空工作区 + 未出生分支 data。
      # 凭证策略（审查修复环 R1）：actions/checkout 把 GITHUB_TOKEN 凭证文件挂到
      # 主检出本地配置的 includeIf.gitdir:<检出>/.git.path，并附带
      # includeIf.gitdir:<检出>/.git/worktrees/*.path 变体——worktree 命中后者，push 可用；
      # 若在本步骤里对 data-branch 单独 git init，新仓库两者皆无，匿名 push 必被拒。
      # 失败方向安全：后续任何步骤失败都不会推送任何远端引用。
      - name: Create orphan worktree（空树 + 未出生分支）
        run: git worktree add --orphan -b data data-branch

      # CLI 初始化：不抓取、不产出快照；首日真实数据由之后的首次 update-data 采集。
      # --expected-sha empty = 空 data 分支占位 HEAD 契约（见 scripts/update-data.ts 头注）。
      - name: Initialize empty authoritative state
        run: >
          node scripts/update-data.ts
          --store git
          --dir data-branch
          --expected-sha empty
          --init

      - name: Commit and push data（孤儿历史，根提交即初始化提交；非快进即失败）
        working-directory: data-branch
        run: |
          git add state.json items.json manifest.json
          git -c user.name="overthecocoons-data-bot" -c user.email="actions@users.noreply.github.com" \
            commit -m "data: manual initialization (MVP-Q13 manual entry)"
          # 无强制推送：远端若被并发创建，本次 push 因历史无关被拒（非快进），运行失败等待重试。
          git push origin data
